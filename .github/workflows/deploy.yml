name: Validación y preparación de despliegue
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend - sintaxis y pruebas API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/backend/package-lock.json
      - name: Instalar dependencias
        working-directory: app/backend
        run: npm ci
      - name: Verificar sintaxis
        working-directory: app/backend
        run: npm run check
      - name: Ejecutar pruebas
        working-directory: app/backend
        run: npm test

  frontend:
    name: Frontend - compilación y pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - name: Instalar dependencias
        working-directory: app/frontend
        run: npm ci
      - name: Compilar frontend
        working-directory: app/frontend
        run: npm run build
      - name: Ejecutar pruebas frontend
        working-directory: app/frontend
        run: npm test -- --watch=false

  terraform:
    name: Terraform - formato y validación
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - name: Formato
        working-directory: infraestructura/terraform
        run: terraform fmt -check -recursive
      - name: Inicializar sin backend remoto
        working-directory: infraestructura/terraform
        run: terraform init -backend=false -input=false
      - name: Validar configuración
        working-directory: infraestructura/terraform
        run: terraform validate

  package:
    name: Preparar artefactos
    needs: [backend, frontend, terraform]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: fuente-tienda-modular
          path: |
            app/backend/
            app/frontend/
            infraestructura/terraform/
            scripts/user_data.sh
          if-no-files-found: error
          retention-days: 7
